# Render Blueprint: connect this repo in Render (New > Blueprint) and it reads this file.
# Two services: the chat site (elvarn) and the knowledge service (elvarn-knowledge, free plan, one Docker container like the search service).
services:
  - type: web
    name: elvarn
    runtime: python
    plan: starter            # 512 MB (free) is very tight for PyTorch; use "free" only to try it out
    buildCommand: pip install --upgrade pip && pip install -r requirements-render.txt
    startCommand: python -m uvicorn backend.api.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    buildFilter:
      ignoredPaths:
        - knowledge_service/**   # refreshing the knowledge snapshot must not redeploy the site
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ELVARN_CHECKPOINT_DIR
        value: deploy/models/17m_rag   # the live 17M RAG model (512 context, val loss 2.408). Older models are in git history.
      - key: ELVARN_PUBLIC
        value: "1"                   # rate limit + concurrency cap + reload disabled
      - key: ELVARN_RATE_LIMIT
        value: "20"                  # chat requests per visitor per minute
      - key: ELVARN_MAX_CONCURRENT
        value: "2"                   # simultaneous replies
      - key: OMP_NUM_THREADS
        value: "1"
      - key: KNOWLEDGE_URL           # the knowledge service below (the site only sends the token over https)
        value: https://elvarn-knowledge.onrender.com
      - key: KNOWLEDGE_TOKEN         # the same secret as the knowledge service: shared, never written in this file
        fromService:
          type: web
          name: elvarn-knowledge
          envVarKey: KNOWLEDGE_TOKEN

  - type: web
    name: elvarn-knowledge
    runtime: docker
    plan: free                       # 512 MB: measured 190 MB idle / 237 MB under load, no outside service needed (see knowledge_service/README.md)
    dockerfilePath: ./knowledge_service/Dockerfile
    dockerContext: .                 # the build needs backend/knowledge and backend/usermemory from the repo root
    healthCheckPath: /healthz
    autoDeploy: true
    buildFilter:
      paths:
        - knowledge_service/**
        - backend/knowledge/**
        - backend/usermemory/**
    envVars:
      - key: KNOWLEDGE_TOKEN         # generated once by Render (a long random secret); the site reads the same value
        generateValue: true
