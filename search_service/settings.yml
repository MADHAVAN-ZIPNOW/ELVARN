# SearXNG settings for the PRODUCTION search service (runs inside the container, behind proxy.py).
# SearXNG listens on 127.0.0.1 only; the public door is the gatekeeper (proxy.py), which checks a token.
use_default_settings:
  engines:
    # Engines that need no API key. Several general engines are OFF by default in SearXNG, so they are switched on below.
    # (Search engines often block cloud-server addresses, so a wider set gives more chances that one of them answers.)
    # duckduckgo and brave are NOT listed: from Render's address they time out / are rate limited, and SearXNG waits for them,
    # which slowed every search and made results intermittent.
    keep_only:
      - google cse
      - bing
      - yahoo
      - mwmbl
      - wikipedia
      - wikidata
      - bing news
      - google news
      - reuters
      - wikinews
      - arxiv
      - github
      - stackoverflow

engines:
  - name: bing
    disabled: false
  - name: yahoo
    disabled: false
  - name: mwmbl
    disabled: false

general:
  instance_name: "search"
  debug: false

search:
  safe_search: 1            # 0 = off, 1 = moderate, 2 = strict
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json                  # required: the gatekeeper always asks for format=json

server:
  bind_address: "127.0.0.1"   # never reachable from outside the container
  port: 8081
  # secret_key is NOT stored here: SearXNG reads the SEARXNG_SECRET environment variable.
  limiter: false              # the gatekeeper does the authentication and rate limiting
  public_instance: false
  image_proxy: false
  method: "GET"

ui:
  results_on_new_tab: false

outgoing:
  request_timeout: 5.0
  max_request_timeout: 7.0
